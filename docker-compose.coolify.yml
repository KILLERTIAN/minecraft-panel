services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: mc
    tty: true
    stdin_open: true
    ports:
      - "26666:25565"
    environment:
      EULA: "TRUE"
      TYPE: "VANILLA"
      VERSION: "26.2"
      ONLINE_MODE: "FALSE"
      MEMORY: "${MC_MEMORY:-3G}"
      USE_AIKAR_FLAGS: "true"
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      ENABLE_WHITELIST: "false"
      ENFORCE_WHITELIST: "false"
      OVERRIDE_WHITELIST: "false"
      MODRINTH_PROJECTS: ""
      MOTD: "Personal server - powered by MC Panel"
    volumes:
      - mc-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc-health"]
      start_period: 1m
      interval: 30s
      retries: 10

  panel:
    image: omsharma050322/mc-panel:latest
    container_name: panel
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      MC_CONTAINER: "mc"
      RCON_HOST: "mc"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      MC_DATA_PATH: "/mc-data"
      WORLD_NAME: "${WORLD_NAME:-world}"
      SERVER_ADDRESS: "${SERVER_ADDRESS:-minecraft.garcade.in:26666}"
      PANEL_DATA_DIR: "/app/data"
      COOKIE_SECURE: "true"
      GDRIVE_SERVICE_ACCOUNT_KEY: "${GDRIVE_SERVICE_ACCOUNT_KEY:-}"
      GDRIVE_FOLDER_ID: "${GDRIVE_FOLDER_ID:-}"
      BACKUP_SCHEDULE: "${BACKUP_SCHEDULE:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mc-data:/mc-data
      - panel-data:/app/data
    depends_on:
      - minecraft
    restart: unless-stopped

volumes:
  mc-data:
  panel-data:
